{% extends "base.html" %}

{% block title %}History - GenZ Translator{% endblock %}

{% block content %}
<div class="history-page">
    <div class="container">
        <div class="page-header">
            <h1><i class="las la-history"></i> Translation History</h1>
            <p>View all your past translations</p>
        </div>
        
        <div class="history-stats">
            <div class="stat-box">
                <i class="las la-language"></i>
                <div>
                    <h3 id="totalTranslations">0</h3>
                    <p>Total Translations</p>
                </div>
            </div>
        </div>
        
        <div class="history-container">
            <div class="history-filters">
                <input 
                    type="text" 
                    id="searchHistory" 
                    class="form-control" 
                    placeholder="Search translations..."
                >
            </div>
            
            <div class="history-list" id="historyList">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Loading translations...</p>
                </div>
            </div>
            
            <div class="pagination" id="pagination" style="display: none;">
                <button class="btn btn-outline" id="prevPage" disabled>
                    <i class="las la-angle-left"></i> Previous
                </button>
                <span class="page-info" id="pageInfo">Page 1 of 1</span>
                <button class="btn btn-outline" id="nextPage" disabled>
                    Next <i class="las la-angle-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
