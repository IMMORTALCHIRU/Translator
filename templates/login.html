{% extends "base.html" %}

{% block title %}Login - GenZ Translator{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="auth-container animate-slide-up">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="las la-sign-in-alt"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Login to continue your translation journey</p>
            </div>
            
            <form method="POST" class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email">
                        <i class="las la-envelope"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="Enter your email"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="las la-lock"></i> Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Enter your password"
                        required
                    >
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="las la-sign-in-alt"></i> Login
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? 
                    <a href="{{ url_for('auth.register') }}">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
