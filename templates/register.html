{% extends "base.html" %}

{% block title %}Register - GenZ Translator{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="auth-container animate-slide-up">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="las la-user-plus"></i>
                </div>
                <h2>Create Account</h2>
                <p>Join GenZ Translator and start breaking language barriers</p>
            </div>
            
            <form method="POST" class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="username">
                        <i class="las la-user"></i> Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        placeholder="Enter your username"
                        required
                        minlength="3"
                    >
                </div>
                
                <div class="form-group">
                    <label for="email">
                        <i class="las la-envelope"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="Enter your email"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="las la-lock"></i> Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Enter your password"
                        required
                        minlength="6"
                    >
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">
                        <i class="las la-lock"></i> Confirm Password
                    </label>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        class="form-control" 
                        placeholder="Confirm your password"
                        required
                        minlength="6"
                    >
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="las la-user-plus"></i> Create Account
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? 
                    <a href="{{ url_for('auth.login') }}">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
